name: Build APK

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'  # or your preferred version
          channel: 'stable'
          
      - run: flutter pub get
      - run: flutter build apk --release
      
